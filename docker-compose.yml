services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${USER}
      - POSTGRES_PASSWORD=${PASSWORD}
      - POSTGRES_DB=${NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${USER} -d $${NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${DOCKER_HUB_USERNAME}/myapp:${GIT_SHA}
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 120 --workers 4"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/swagger/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "80:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    image: ${DOCKER_HUB_USERNAME}/myapp:${GIT_SHA}
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  celery_beat:
    image: ${DOCKER_HUB_USERNAME}/myapp:${GIT_SHA}
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    healthcheck:
      test: [ "CMD-SHELL", "celery --app config inspect ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
